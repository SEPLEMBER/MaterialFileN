name: Android CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build F-Droid Release APK
      # Собираем только flavor 'fdroid' для релизной конфигурации
      run: ./gradlew assembleFdroidRelease

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-fdroid-release-unsigned
        # Путь к APK для конкретного flavor находится в подпапке fdroid
        path: app/build/outputs/apk/fdroid/release/*.apk
        retention-days: 2
